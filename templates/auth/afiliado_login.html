{% extends 'base.html' %}

{% block title %}Login Afiliado{% endblock %}

{% block content %}
<style>
    .m-auth-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: calc(100vh - 200px);
        padding: 2rem 1rem;
        background-color: #f8fafc;
    }
    .m-auth-card {
        background-color: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 4px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        width: 100%;
        max-width: 400px;
        padding: 2.5rem 2rem;
        text-align: center;
    }
    .m-auth-icon {
        color: #3b82f6;
        font-size: 3rem;
        margin-bottom: 1rem;
    }
    .m-auth-title {
        font-size: 1.5rem;
        font-weight: 700;
        color: #0f172a;
        margin: 0 0 0.5rem 0;
    }
    .m-auth-subtitle {
        font-size: 0.875rem;
        color: #64748b;
        margin: 0 0 2rem 0;
    }
    .m-auth-form-group {
        margin-bottom: 1.25rem;
        text-align: left;
    }
    .m-auth-label {
        display: block;
        font-size: 0.875rem;
        font-weight: 600;
        color: #334155;
        margin-bottom: 0.5rem;
    }
    .m-auth-input {
        width: 100%;
        padding: 0.75rem 1rem;
        border: 1px solid #cbd5e1;
        border-radius: 2px;
        font-size: 0.875rem;
        color: #1e293b;
        background-color: #f8fafc;
        transition: all 0.2s;
    }
    .m-auth-input:focus {
        outline: none;
        border-color: #3b82f6;
        background-color: #ffffff;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }
    .m-auth-btn {
        width: 100%;
        background-color: #3b82f6;
        color: white;
        padding: 0.75rem 1rem;
        font-size: 0.875rem;
        font-weight: 600;
        border: none;
        border-radius: 2px;
        cursor: pointer;
        transition: all 0.2s;
        margin-top: 0.5rem;
    }
    .m-auth-btn:hover {
        background-color: #2563eb;
    }
    .m-auth-footer {
        margin-top: 2rem;
        padding-top: 1.5rem;
        border-top: 1px solid #e2e8f0;
        font-size: 0.875rem;
        color: #64748b;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
    }
    .m-auth-footer a {
        color: #3b82f6;
        text-decoration: none;
        font-weight: 500;
    }
    .m-auth-footer a:hover {
        text-decoration: underline;
    }
</style>

<div class="m-auth-container">
    <div class="m-auth-card">
        <span class="material-symbols-outlined m-auth-icon">assignment_ind</span>
        <h1 class="m-auth-title">Acceso Afiliados</h1>
        <p class="m-auth-subtitle">Ingresa a tu panel para ver tus comisiones</p>

        <form method="POST" action="{{ url_for('auth.afiliado_login') }}">
            <!-- Token CSRF -->
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="m-auth-form-group">
                <label for="codigo" class="m-auth-label">Código de Afiliado</label>
                <input type="text" id="codigo" name="codigo" class="m-auth-input" required autofocus>
            </div>

            <div class="m-auth-form-group">
                <label for="password" class="m-auth-label">Contraseña</label>
                <input type="password" id="password" name="password" class="m-auth-input" required>
            </div>

            <button type="submit" class="m-auth-btn">Ingresar al Panel</button>
        </form>

        <div class="m-auth-footer">
            <p>¿Aún no eres afiliado? <a href="{{ url_for('tienda.unete') }}">Únete aquí</a></p>
            <p><a href="{{ url_for('auth.admin_login') }}">Login Administrador</a></p>
        </div>
    </div>
</div>
{% endblock %}
