{% extends 'base.html' %}

{% block title %}Login Administrador{% endblock %}

{% block content %}
<div class="container">
    <div class="login-container">
        <div class="login-box">
            <h1>🔐 Login Administrador</h1>
            <p class="subtitle">Acceso al panel de administración</p>

            <form method="POST" action="{{ url_for('auth.admin_login') }}">
                <!-- [MODIFICACIÓN SEGURIDAD E22] -->
                <!-- Token requerido para prevenir ataques de falsificación de solicitudes -->
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" name="username" class="form-control" required autofocus>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" class="form-control" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Iniciar Sesión</button>
            </form>

            <div class="login-footer">
                <p><a href="{{ url_for('auth.afiliado_login') }}">¿Eres afiliado? Ingresa aquí</a></p>
                <p><a href="{{ url_for('tienda.index') }}">← Volver a la tienda</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
