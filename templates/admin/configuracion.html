{% extends 'base.html' %}

{% block title %}Configuración de la Tienda - Admin{% endblock %}

{% block content %}
<style>
    .m-form-card {
        background-color: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 4px;
        padding: 2rem;
        box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        max-width: 800px;
    }
    .m-form-group {
        margin-bottom: 1.5rem;
    }
    .m-form-label {
        display: block;
        font-size: 0.875rem;
        font-weight: 600;
        color: #334155;
        margin-bottom: 0.5rem;
    }
    .m-form-control {
        width: 100%;
        padding: 0.75rem 1rem;
        border: 1px solid #cbd5e1;
        border-radius: 2px;
        font-size: 0.875rem;
        color: #1e293b;
        background-color: #f8fafc;
        transition: all 0.2s;
    }
    .m-form-control:focus {
        outline: none;
        border-color: #3b82f6;
        background-color: #ffffff;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }
    .m-current-logo {
        margin-top: 1rem;
        padding: 1rem;
        border: 1px solid #e2e8f0;
        border-radius: 4px;
        display: inline-block;
        background-color: #f8fafc;
    }
    .m-current-logo img {
        max-height: 80px;
    }
</style>

<div class="m-admin-container">
    <div class="m-admin-header">
        <span class="material-symbols-outlined m-admin-icon-title">settings</span>
        <h1>Configuración de la Tienda</h1>
    </div>

    <div class="m-form-card">
        <form method="POST" action="{{ url_for('admin.configuracion') }}" enctype="multipart/form-data">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="m-form-group">
                <label class="m-form-label" for="nombre_tienda">Nombre de la Tienda (White Label)</label>
                <input type="text" id="nombre_tienda" name="nombre_tienda" class="m-form-control" 
                       value="{{ config_web.nombre_tienda if config_web else 'Shop Fusion' }}" required>
            </div>

            <div class="m-form-group">
                <label class="m-form-label" for="logo">Logo de la Tienda (Opcional)</label>
                <input type="file" id="logo" name="logo" class="m-form-control" accept="image/*">
                {% if config_web and config_web.logo_path %}
                    <div class="m-current-logo">
                        <p style="font-size:0.75rem; color:#64748b; margin-top:0; margin-bottom:0.5rem;">Logo Actual:</p>
                        <img src="{{ url_for('static', filename='uploads/' + config_web.logo_path) }}" alt="Logo Tienda">
                    </div>
                {% endif %}
            </div>

            <div class="m-form-group">
                <label class="m-form-label" for="direccion">Dirección Física o Sede Central</label>
                <input type="text" id="direccion" name="direccion" class="m-form-control" 
                       value="{{ config_web.direccion if config_web else '' }}">
            </div>

            <div class="m-form-group">
                <label class="m-form-label" for="email">Correo de Soporte/Contacto</label>
                <input type="email" id="email" name="email" class="m-form-control" 
                       value="{{ config_web.email if config_web else '' }}">
            </div>

            <div class="m-form-group">
                <label class="m-form-label" for="mensaje_footer">Mensaje de "Acerca de la Empresa" (Footer)</label>
                <textarea id="mensaje_footer" name="mensaje_footer" class="m-form-control" rows="3">{{ config_web.mensaje_footer if config_web else '' }}</textarea>
            </div>

            <div class="m-form-group">
                <label class="m-form-label" for="mensaje_copyright">Mensaje de Copyright (Footer)</label>
                <input type="text" id="mensaje_copyright" name="mensaje_copyright" class="m-form-control" 
                       value="{{ config_web.mensaje_copyright if config_web else '© 2024 Todos los derechos reservados' }}">
            </div>

            <div style="margin-top: 2rem;">
                <button type="submit" class="m-btn-primary-sm" style="padding: 0.75rem 2rem; font-size:1rem;">Guardar Configuración</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
